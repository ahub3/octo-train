modules:
  - type: dnf
    repos:
      cleanup: true # clean up added repos after module is done
      copr:
        - faugus/faugus-launcher
        - atim/zerotier-one
    install:
      skip-unavailable: true # skip unavailable packages
      packages:
        - gamescope
        - mangohud
        - faugus-launcher
        #- zerotier-one
        #- miniupnpc-devel #to try to fix zerotier-one
# Non-free packages install
  - type: dnf
    repos:
      nonfree: negativo17
      cleanup: true
    install:
      install-weak-deps: false
      packages:
        - steam
        - kernel-modules-extra

  - type: files
    files:
      - source: gaming 
        destination: /
  - type: containerfile
    snippets:
      - RUN rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-ZEROTIER 
      - RUN dnf install zerotier-one
