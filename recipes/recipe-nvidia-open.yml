---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: octo-train-nvidia-open 
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 43 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
# Copy configuration files needed for sway and nvidia container toolkit
  - type: files
    files:
      - source: system_nvidia
        destination: /

#  - type: akmods
#    base: main
#    nvidia-driver: nvidia-open
#    install:
#      - nvidia
  

  - type: script
    env:
      PUBLIC_KEY_DER_PATH: /etc/pki/akmods/certs/akmods-blue-build.der
    secrets:
      - type: file
        source: ./MOK.priv
        mount:
          type: file
          destination: /tmp/certs/private_key.priv
    scripts:
      - installnvidia.sh
  - type: systemd 
    system: 
      enabled:
        - nvidia-cdi.service

# Install Nvidia Container Toolkit
#  - type: dnf 
#    repos:
#      files:
#        - https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo 
#      cleanup: true
#    install:
#      packages:
#        - nvidia-container-toolkit
#  - type: systemd 
#    system: 
#      enabled:
#        - nvidia-cdi-refresh.service 

# Set kargs for nvidia drivers
  - type: kargs
    arch: x86_64
    kargs:
      - rd.driver.blacklist=nouveau
      - modprobe.blacklist=nouveau
      - nvidia-drm.modeset=1
      - nvidia-drm.fbdev=1
      - initcall_blacklist=simpledrm_platform_driver_init

  - type: script
    snippets:
      - cp /usr/lib/modprobe.d/nvidia-modeset.conf /etc/modprobe.d/nvidia-modeset.conf
      - sed -i 's/omit_drivers/force_drivers/g' /usr/lib/dracut/dracut.conf.d/99-nvidia.conf
      - sed -i 's/ nvidia / i915 amdgpu nvidia /g' /usr/lib/dracut/dracut.conf.d/99-nvidia.conf

  - from-file: common.yml 
